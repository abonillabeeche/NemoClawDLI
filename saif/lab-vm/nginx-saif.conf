# SAIF lab course host: branded course + launchable-compatible agent endpoints on ONE origin,
# so the course's same-origin calls work over plain HTTP inside the lab / Tailscale.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    auth_basic "SAIF lab";
    auth_basic_user_file /etc/nginx/saif.htpasswd;

    root /var/lib/saif-course/site;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    # websockets (the shim) rejects HTTP/1.0, nginx's default upstream protocol.
    location = /healthz    { auth_basic off; proxy_pass http://127.0.0.1:8090; proxy_http_version 1.1; }
    location = /api/agent  { proxy_pass http://127.0.0.1:8090; proxy_http_version 1.1; proxy_read_timeout 60s; }

    location = /ws/terminal {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Model API for the browser lessons, same origin as the course (no mixed content, CORS or
    # private-network preflight). Exempt from basic auth: the course sends its own
    # "Authorization: Bearer <key>", which replaces the browser's basic credentials. The lab
    # router is already open on the LAN; nginx injects its key (SAIF_LLM_KEY, `<router-key>`).
    location = /v1/embeddings {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081/v1/embeddings;   # TEI (saif-embed container)
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        client_max_body_size 4m;
        proxy_read_timeout 120s;
    }
    location /v1/ {
        auth_basic off;
        proxy_pass @@ROUTER_URL@@/;              # lab LiteLLM router (SAIF_LLM_URL)
        proxy_http_version 1.1;
        proxy_set_header Host @@ROUTER_HOSTPORT@@;
        proxy_set_header Authorization "Bearer @@LLM_KEY@@";
        proxy_buffering off;                                # stream tokens as they arrive
        client_max_body_size 8m;
        proxy_read_timeout 600s;
    }

    # OpenClaw gateway (NemoClaw's loopback dashboard forward). Present the gateway's own
    # loopback origin so its origin check accepts the proxied browser socket.
    location = /cli/gateway {
        proxy_pass http://127.0.0.1:18789/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:18789;
        proxy_set_header Origin http://127.0.0.1:18789;
        proxy_read_timeout 3600s;
    }
}
