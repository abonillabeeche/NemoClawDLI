# SAIF lab course host: branded course + launchable-compatible agent endpoints on ONE origin,
# so the course's same-origin calls work over plain HTTP inside the lab / Tailscale.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    auth_basic "SAIF lab";
    auth_basic_user_file /etc/nginx/saif.htpasswd;

    root /var/lib/saif-course/site;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    location = /healthz    { auth_basic off; proxy_pass http://127.0.0.1:8090; }
    location = /api/agent  { proxy_pass http://127.0.0.1:8090; proxy_read_timeout 60s; }

    location = /ws/terminal {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # OpenClaw gateway (NemoClaw's loopback dashboard forward). Present the gateway's own
    # loopback origin so its origin check accepts the proxied browser socket.
    location = /cli/gateway {
        proxy_pass http://127.0.0.1:18789/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:18789;
        proxy_set_header Origin http://127.0.0.1:18789;
        proxy_read_timeout 3600s;
    }
}
